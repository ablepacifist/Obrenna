name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Build backend executable
        working-directory: backend
        run: |
          pyinstaller obrenna-server.spec --clean
        shell: bash

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: dist/obrenna-server${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
          retention-days: 1

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.platform.os_name }}
          path: src-tauri/resources/backend

      - name: Make backend executable
        run: chmod +x src-tauri/resources/backend/obrenna-server${{ matrix.platform.os_name == 'windows' && '.exe' || '' }}
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install webkit2gtk (Linux)
        if: matrix.platform.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1

      - name: Sync node version and setup
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_VERSION: '20'
        with:
          args: --target ${{ matrix.platform.target }}

      - name: Rename backend for upload
        run: |
          mkdir -p release-assets
          cp src-tauri/resources/backend/obrenna-server${{ matrix.platform.os_name == 'windows' && '.exe' || '' }} release-assets/obrenna-server${{ matrix.platform.os_name == 'windows' && '.exe' || '' }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/obrenna-server${{ matrix.platform.os_name == 'windows' && '.exe' || '' }}
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.appimage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.deb
        generate_release_notes: true
