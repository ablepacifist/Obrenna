[package]
name = "obrenna-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "obrenna-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
regex = "1"
